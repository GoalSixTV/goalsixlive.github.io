<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe Embed Player</title>
    <!-- Shaka Player UI CSS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .shaka-video-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .shaka-spinner-container, .shaka-spinner, .shaka-spinner-svg {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        /* Status or Loading Layer */
        #loader {
            position: absolute;
            inset: 0;
            background: #07090E;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            z-index: 50;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="loader">Initializing Secure Stream...</div>

    <!-- Shaka Player Video Container -->
    <div class="shaka-video-container" data-shaka-player>
        <video autoplay playsinline preload="metadata"></video>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            shaka.polyfill.installAll();
            
            if (!shaka.Player.isBrowserSupported()) {
                document.getElementById('loader').innerText = 'Browser does not support Shaka Player.';
                return;
            }

            const video = document.querySelector('video');
            const player = new shaka.Player(video);
            const container = document.querySelector('.shaka-video-container');
            const ui = new shaka.ui.Overlay(player, container, video);

            ui.configure({
                controlPanelElements: [
                    'play_pause', 'time_and_duration', 'mute', 'volume',
                    'spacer', 'quality', 'fullscreen'
                ]
            });

            // Stream Library with ClearKey DRM
            const streams = {
                "1": {
                    url: "https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/dev1hjwzh9/out/v1/a5f0ee7ad7b24906b14f43bebbbe4678/cenc.mpd",
                    keyId: "cc91508324ce9dcaf425a43d58f1d9d4",
                    key: "643e5474d9edd87c7d9091c8c97994ca"
                },
                "2": {
                    url: "https://otte.cache.aiv-cdn.net/iad-nitro/live/clients/dash/enc/b3b3fkmrbl/out/v1/1084d5c9a97a4c5b9f9554c88f486646/cenc.mpd",
                    keyId: "82dfca238e8c4b430a3269db71965db9",
                    key: "a00b28caf4ac628e77a553d440c0ddca"
                },
                "dh": {
                   url: "https://ottlive.dishhome.com.np/protected/vVnVkZ4Bnu3lGwDQJxH-/dash/manifest.mpd",
                   keyId: "2bb7f4489e5f421eb0de90035cffb2bc",
                   key: "96b09b69c638dac184f42910e0095933"

                },
                "prime": { 
                    url: "https://otte.live.fly.ww.aiv-cdn.net/syd-nitro/live/dash/enc/pnes4dv2ag/out/v1/e21d21ec21e34c7192049a44ee3de428/cenc.mpd",
                    keyId: "ed76c18710d621a87c89dedc7c13019f",
                    key: "7241c82fe48525a9dc6be6d7bb86611f"
                },
                "hub": { 
                    url: "https://otte.live.fly.ww.aiv-cdn.net/iad-nitro/live/clients/dash/enc/wvylr4q2ne/out/v1/eb85f5cd635b45ccb7e12a5b30eedbca/cenc.mpd",
                    keyId: "159dd69da817d0d0ac8fda7e438cd60c",
                    key: "40d9fba7aebb69953b20bf7af83c29bd"
                },
                "willow": { 
                    url: "https://a96aivottlinear-a.akamaihd.net/OTTB/pdx-nitro/live/clients/dash/enc/myvotpnueo/out/v1/31f5a50cbd8041308c560355044e0b03/cenc.mpd",
                    keyId: "91ffd985da527c7d77ecc801128d11cc",
                    key: "3bb5d51b2fef3b50c43d0cc12455eaf7"
                },
                "hindi": { 
                    url: "https://otte.live.cf.ww.aiv-cdn.net/syd-nitro/live/dash/enc/utvv87801b/out/v1/d9a29796c1c3468785dbee1776ffd354/cenc.mpd",
                    keyId: "531599a595f0a03ced73300beaec99b7",
                    key: "f5a77d391847790f46059cbb092d575b"
                }
            };

            // Get Stream ID from URL (e.g. your-github-pages-url.com/?id=hub)
            const urlParams = new URLSearchParams(window.location.search);
            const streamId = urlParams.get('id') || "1";
            const stream = streams[streamId];

            if (!stream) {
                document.getElementById('loader').innerText = "Error: Invalid Stream ID specified.";
                document.getElementById('loader').style.color = "#ef4444";
                return;
            }

            // Apply DRM ClearKey configuration
            player.configure({
                drm: {
                    clearKeys: {
                        [stream.keyId]: stream.key
                    }
                },
                streaming: {
                    lowLatencyMode: true
                }
            });

            // Play stream
            try {
                await player.load(stream.url);
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 300); // Smooth fade out
                console.log("✅ Successfully loaded stream ID:", streamId);
            } catch (error) {
                console.error("❌ Failed to load stream:", error);
                document.getElementById('loader').innerText = "Failed to load stream. Stream might be offline.";
                document.getElementById('loader').style.color = "#ef4444";
            }
        });
    </script>
</body>
</html>
